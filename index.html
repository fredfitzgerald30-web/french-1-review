const END=['e','es','e','ons','ez','ent'];

function conj(v,i){ if(IRR[v]) return [IRR[v][i]]; const st=v.slice(0,-2);

function verbRule(v,i){
  if(['être','avoir','aller'].includes(v)) return `${v} is irregular: ${IRR[v].join(', ')}.`;

  if(r<.95) return mc('When do you use <span class="fr">bel, nouvel, vieil</span>?','before a masculine singular noun starting with a vowel or silent h',['before any feminine noun','before any plural noun','after the noun'],'un bel homme, un nouvel ami, un vieil hôtel.','BANGS');
  return mc('<span class="fr">des</span> becomes <span class="fr">de</span> when…','a plural adjective comes before the noun',['the noun is feminine','the adjective comes after the noun','the sentence is a question'],'de mauvais films, de vieilles femmes, but des livres intéressants.','BANGS'); }
function avoirMC(){ const r=Math.random();
  if(r<.45){ const [s,w]=pick(AVSCEN); return mc(s.replace('___',blank),w,AVWORDS,'','Avoir expressions'); }
  if(r<.75){ const a=pick(AVOIR); return mc(`What does <span class="fr">${a[0]}</span> mean?`,a[1],AVOIR.map(x=>x[1]),'','Avoir expressions'); }
  const a=pick(AVOIR); return mc(`How do you say <b>${a[1]}</b>?`,a[0],AVOIR.map(x=>x[0]),'','Avoir expressions'); }
function questMC(){ const r=Math.random();
  if(r<.45){ const [s,w]=pick(QSCEN); return mc(s.replace('___',blank),w,QWORDS,'','Question words'); }
  if(r<.7){ const o=pick(OUISI); return mc(o[0],o[1],o[2],o[3],'Oui / Si / Non'); }
  const q=pick(QW); return mc(`What does <span class="fr">${q[0]}</span> mean?`,q[1],QW.map(x=>x[1]),'','Question words'); }
function verbsMC(){ const r=Math.random();
  if(r<.55) return conjItem(pick(CONJV),true,true);
  if(r<.8){ const v=pick([...VERBS,...GER,...YER,...CER]); return mc(`What does <span class="fr">${v[0]}</span> mean?`,v[1],[...VERBS,...GER,...YER,...CER].map(x=>x[1]),'','Verbs'); }
  return pick([()=>mc('-ger verbs (manger, nager) change in which form?','nous',['je','vous','ils/elles'],'nous mangeons: keep the e so the g stays soft.','Spelling-change verbs'),
    ()=>mc('-cer verbs (commencer) change how?','c → ç in the nous form',['c → s in all forms','add an e in the nous form','no change'],'nous commençons.','Spelling-change verbs'),
    ()=>mc('-yer verbs (envoyer, nettoyer) change y → i for…','je, tu, il/elle, ils/elles (the boot)',['nous and vous only','only je','every form'],"j'envoie, nous envoyons, ils envoient.",'Spelling-change verbs'),
    ()=>mc('avoir: vous ___','avez',['allez','avons','êtes'],'avoir: ai, as, a, avons, avez, ont.','Verbs'),
    ()=>mc('être: nous ___','sommes',['sont','êtes','avons'],'être: suis, es, est, sommes, êtes, sont.','Verbs'),
    ()=>mc('aller: ils ___','vont',['sont','ont','allent'],'aller: vais, vas, va, allons, allez, vont.','Verbs')])(); }
function houseMC(){ const h=pick(HOUSE); return Math.random()<.55? mc(`What does <span class="fr">${h[0]}</span> mean?`,h[1],HOUSE.map(x=>x[1]),'','La maison') : mc(`How do you say <b>${h[1]}</b>?`,h[0],HOUSE.map(x=>x[0]),'','La maison'); }
function cultureMC(){ const c=pick(CULTURE); return mc(c[0],c[1],c[2],'','Culture'); }

/* --- vocab (typed) --- */
let vdir;
function vocabGen(list,label){ return ()=>{ const v=pick(list); const fr=v[0].split(' / ');
  if(vdir()==='ef') return typed(`<b>${esc(v[1])}</b>${v[2]?`<span class="hint">${esc(v[2])}</span>`:''}`, [...fr, ...(v[0].includes('W.-C.')?['les WC','les toilettes']:[])], label==='La maison'?'Include the article (le, la, un, une…).':'', label+' · English → French',{ph:'Type the French'});
  return typed(`<span class="fr">${esc(v[0])}</span>`, [v[1]], '', label+' · French → English',{en:true,ph:'Type the English'}); }; }

/* --- adjectives (typed) --- */
function adjForm(){ const a=pick(PHR); const pl=Math.random()<.45; let n=nounFor(a); if(a[4]&&!pl&&Math.random()<.5) n=pick(NOUNS.filter(x=>x[1]==='m'&&x[2]&&(!a[7]||x[3]))); const p=phrase(a,n,pl);
  const q=p.bangs?`${p.art} ${blank} ${p.noun}`:`${p.art} ${p.noun} ${blank}`;
  return typed(`${q} <span class="hint">(${a[0]})</span>`, adjForms(a,n[1],pl,n[2]), adjWhy(a,true,pl,n[1],p.form===a[4]), `Agreement · ${n[1]==='m'?'masc.':'fem.'} ${pl?'plural':'singular'}`); }
function adjBuild(){ const a=pick(PHR.filter(x=>x[5]||Math.random()<.5)); const pl=Math.random()<.45; let n=nounFor(a); if(a[4]&&!pl&&Math.random()<.5) n=pick(NOUNS.filter(x=>x[1]==='m'&&x[2]&&(!a[7]||x[3]))); const p=phrase(a,n,pl);
  const art0=pl?'des':(n[1]==='m'?'un':'une');
  return typed(`<span class="fr">${art0}</span> + <span class="fr">${pl?plural(n[0]):n[0]}</span> + <span class="fr">${a[0]}</span><span class="hint">Write the whole phrase in the right order.</span>`, [p.txt], adjWhy(a,true,pl,n[1],p.form===a[4]), 'Build the phrase (BANGS)',{ph:'e.g. une haute maison'}); }
function adjColor(){ const c=pick(COLORS), n=pick(CNOUNS); const pl=!!n[2]; const i=idxOf(n[1],pl);
  const art=pl?'des':(n[1]==='m'?'un':'une');
  return typed(`${art} ${n[0]} ${blank} <span class="hint">(${c[0]})${pl?` · ${n[1]}. plural`:''}</span>`, [c[i]], adjWhy(c), 'Colors'); }
function adjTable(){ const a=pick(allAdj); const i=1+Math.floor(Math.random()*3);
  return typed(`<span class="fr">${a[0]}</span> → <b>${COLN[i]}</b>`, [a[i],...((ALT[a[0]]||{})[i]||[])], adjWhy(a), 'All forms'); }

/* --- prepositions (typed) --- */
function prepMean(){ const p=pick(PREP), s=prepSentence(p); return typed(`${s.s} ${blank} ${s.n}. <span class="hint">(${p[1]})</span>`, [s.ans], prepWhy(p,s.art), 'From English',{ph:'Type the missing words'}); }
function prepCombine(){ const p=pick(PREP.filter(x=>x[2]||Math.random()<.3)), s=prepSentence(p); return typed(`${s.s} ${blank} ${s.n}. <span class="hint">(${p[0]} + ${s.art})</span>`, [s.ans], prepWhy(p,s.art), 'Combine',{ph:'Type the missing words'}); }
function prepA(){ const [art,n]=pick(PLACES); return typed(`Je vais ${blank} ${n}. <span class="hint">(à + ${art})</span>`, [aArt[art]], 'à + le = au · à + les = aux · à la and à l’ don’t change.', 'à + article'); }
function prepDe(){ const [art,n]=pick(PLACES); return typed(`Je reviens ${blank} ${n}. <span class="hint">(de + ${art})</span>`, [deArt[art]], 'de + le = du · de + les = des · de la and de l’ don’t change.', 'de + article'); }

/* ================= build tabs ================= */
const D={};
D.mc=drill('mc',{mix:{label:'Mix',fn:()=>null},prep:{label:'Prépositions',fn:prepMC},adj:{label:'Adjectives',fn:adjMC},avoir:{label:'Avoir',fn:avoirMC},quest:{label:'Questions',fn:questMC},verbs:{label:'Verbs',fn:verbsMC},house:{label:'Maison',fn:houseMC},culture:{label:'Culture',fn:cultureMC}});
vdir=chips('vocab-dir',{ef:'English → French',fe:'French → English'},'vdir',()=>D.vocab.next());
D.vocab=drill('vocab',{prep:{label:'Prépositions',fn:vocabGen(PREP,'Prépositions')},avoir:{label:'Avoir',fn:vocabGen(AVOIR,'Avoir')},quest:{label:'Questions',fn:vocabGen(QW,'Questions')},house:{label:'Maison',fn:vocabGen(HOUSE,'La maison')},verbs:{label:'Verbs',fn:vocabGen(VERBS,'Verbs')},spell:{label:'-ger / -yer / -cer',fn:vocabGen([...GER,...YER,...CER],'Verbs')},mix:{label:'Mix',fn:()=>null}});
D.conj=drill('conj',{irr:{label:'être · avoir · aller',fn:()=>conjItem(pick(['être','avoir','aller']))},prendre:{label:'prendre family',fn:()=>conjItem(pick(['prendre','comprendre','apprendre','surprendre']))},er:{label:'Regular -er',fn:()=>conjItem(pick(['jouer','danser','chanter','parler','écouter','étudier','cuisiner','travailler','regarder','aimer','habiter','voyager']))},spell:{label:'-ger · -cer · -yer · acheter',fn:()=>conjItem(pick([...GER,...CER,...YER].map(v=>v[0]).concat(['manger','nager','acheter','acheter','payer','envoyer','commencer'])),false,true)},mix:{label:'Mix',fn:()=>null}});
D.adj=drill('adj',{form:{label:'Agreement',fn:adjForm},build:{label:'Build the phrase',fn:adjBuild},colors:{label:'Colors',fn:adjColor},table:{label:'All 4 forms',fn:adjTable},mix:{label:'Mix',fn:()=>null}});
D.prep=drill('prep',{mean:{label:'From English',fn:prepMean},combine:{label:'Combine (près de + le)',fn:prepCombine},a:{label:'à + article',fn:prepA},de:{label:'de + article',fn:prepDe},mix:{label:'Mix',fn:()=>null}});

/* ================= rules ================= */
const tbl=(head,rows)=>`<div class="tw"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
$('#rules').innerHTML=`
<div class="card fix"><b>Fixed from your notes</b><ul>
<li><b>une commode</b> = dresser (un bureau = desk).</li>
<li><b>nager</b> = to swim (not snow).</li>
<li>avoir: <b>vous avez</b> (vous allez is aller).</li>
<li><b>un vieil homme</b> (vieil before a masc. vowel noun) and <b>de vieilles femmes folles</b>.</li>
<li><b>marron</b> and <b>orange</b> never change: des chiens marron, des voitures orange.</li>
<li>des gommes <b>violettes</b> (plural needs -s).</li>
<li><b>sympa</b> adds -s in the plural: des amis sympas.</li>
<li>Feminine plurals need -es: gourmand<b>es</b>, généreu<b>ses</b>. Masculine plural of sportif is sporti<b>fs</b>, actif is acti<b>fs</b>.</li>
<li><b>châtain</b> traditionally doesn’t change for feminine (châtaine is also accepted). Plural: châtains.</li>
<li>le jardin = garden / yard · un traversin = bolster (long pillow) · les toilettes = toilet / restroom.</li>
</ul></div>
<div class="card"><h2>Prépositions de lieu</h2>${tbl(['French','English'],PREP.map(p=>[`${p[0]}${p[2]?'':' <span class="kbd">no de</span>'}`,p[1]]))}
<p><b>de</b> combines with the article after it: près <b>du</b> bureau, à côté <b>de la</b> porte, en face <b>des</b> fenêtres, près <b>de l’</b>armoire. No de: sous le poster, dans ma chambre.</p>
${tbl(['','le','la','l’','les'],[['à','<b>au</b>','à la','à l’','<b>aux</b>'],['de','<b>du</b>','de la','de l’','<b>des</b>']])}</div>
<div class="card"><h2>Adjective agreement</h2>
${tbl(['','masc.','fem.'],[['singular','—','+e'],['plural','+s (or +x)','+es']])}
<p>If it already ends in that letter, don’t add another one: rouge → rouge, gris → gris (m. pl.).</p>
<div class="grid2"><span>-eux → -euse (heureuse)</span><span>-f → -ve (sportive, active)</span><span>-er → -ère (fière, chère, légère, première, dernière, entière, amère)</span><span>-on → -onne (mignonne, bonne)</span><span>-et → -ette (violette)</span><span>-il → -ille (gentille)</span><span>-os → -osse (grosse)</span><span>roux → rousse</span><span>blanc → blanche</span><span>long → longue</span><span>fou → folle</span><span>beau → belle, nouveau → nouvelle, vieux → vieille</span></div>
<p><b>Invariable:</b> orange, marron, chic, cool, super. (sympa only adds -s.)</p></div>
<div class="card"><h2>BANGS: these go before the noun</h2>
${tbl(['','Adjectives'],[['<b>B</b>eauty','joli, beau (bel), vilain'],['<b>A</b>ge','jeune, vieux (vieil)'],['<b>N</b>ewness','nouveau (nouvel)'],['<b>G</b>oodness','bon, mauvais, gentil'],['<b>S</b>ize','grand, petit, haut, court, long, gros']])}
<p><b>bel / nouvel / vieil</b> are for a masculine singular noun starting with a vowel or silent h: un bel homme, un nouvel ami, un vieil hôtel. Plural stays beaux / nouveaux / vieux.</p>
<p><b>des → de</b> when a plural adjective comes before the noun: de mauvais films, de vieilles femmes.</p>
<p>Everything else goes after: une jeune femme blonde, un nouveau livre intéressant, un homme mince et laid, une personne amusante et intelligente.</p></div>
<div class="card"><h2>Verbs</h2>
${tbl(['','être','avoir','aller','prendre'],[0,1,2,3,4,5].map(i=>[['je','tu','il/elle/on','nous','vous','ils/elles'][i],IRR['être'][i],(i===0?'j’':'')+IRR['avoir'][i],IRR['aller'][i],IRR['prendre'][i]]))}
<p><b>prendre</b> = to take / to have (food or drink). Same pattern: comprendre (understand), apprendre (learn), surprendre (surprise).</p>
<p><b>Regular -er:</b> drop -er, add -e, -es, -e, -ons, -ez, -ent (je joue, nous jouons, ils jouent).</p>
<p><b>-ger:</b> nous keeps the e: nous mangeons. <b>-cer:</b> nous uses ç: nous commençons. <b>-yer:</b> y → i in the boot (je, tu, il, ils): j’envoie, nous envoyons, ils envoient. <b>acheter:</b> j’achète, nous achetons.</p>
<p><b>Subject pronouns:</b> je, tu, il / elle / on (iel, informal) · nous, vous, ils / elles.</p></div>
<div class="card"><h2>Avoir expressions</h2>${tbl(['French','English'],AVOIR.map(a=>[a[0],a[1]]))}</div>
<div class="card"><h2>Questions</h2>${tbl(['French','English'],[['est-ce que','turns a sentence into a yes/no question'],...QW.map(q=>[q[0],q[1]])])}
<p><b>Oui</b> = yes to a normal question. <b>Non</b> = no. <b>Si</b> = yes to a negative question (Tu n’as pas faim ? — Si !). Si also means <b>if</b> and <b>so</b>.</p></div>
<div class="card"><h2>La maison</h2>${tbl(['French','English'],HOUSE.map(h=>[h[0],h[1]]))}</div>
<div class="card"><h2>French house &amp; lifestyle culture</h2>
<p>French houses, yards, cars, and streets are generally <b>smaller</b> than American ones.</p>
<p>French people are more <b>private</b>: yards are closed in by walls, hedges, or fences; doors inside are kept closed; at night the <b>shutters (les volets)</b> and curtains are closed, so houses look dark from the street.</p>
<p>Electricity and landline calls are expensive: people <b>turn off lights</b> when they leave a room, and phone calls are short. <b>La minuterie</b> is a timed light in hallways and stairwells that turns itself off after a minute or two.</p>
<p>Les toilettes (W.-C.) are often a small room separate from la salle de bains.</p></div>`;

/* ================= tabs ================= */
const TABS=['mc','vocab','conj','adj','prep','rules'];
function showTab(t){ TABS.forEach(x=>{ $('#pane-'+x).hidden=x!==t; $('#tab-'+x).setAttribute('aria-selected',x===t); }); store.set('tab',t); ACTIVE=D[t]||null;
  const f=document.querySelector('#pane-'+t+' input[type=text]:not([readonly])'); if(f) f.focus(); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.addEventListener('keydown',e=>{ if(ACTIVE) ACTIVE.onKey(e); });
Object.values(D).forEach(d=>d.next());
const t0=store.get('tab','mc'); showTab(TABS.includes(t0)?t0:'mc');
</script>
